services:
  - type: web
    name: projectbanking-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --index-url https://download.pytorch.org/whl/cpu torch==2.3.1 && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
